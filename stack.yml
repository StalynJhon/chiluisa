version: "3.8"

services:
  chiluisa:
    image: ghcr.io/stalynjhon/chiluisa:1.0.5
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.chiluisa.entrypoints=http"
        - "traefik.http.routers.chiluisa.rule=Host(`chiluisa.byronrm.com`)"
        - "traefik.http.middlewares.chiluisa-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.chiluisa.middlewares=chiluisa-https-redirect"
        - "traefik.http.routers.chiluisa-secure.entrypoints=https"
        - "traefik.http.routers.chiluisa-secure.rule=Host(`chiluisa.byronrm.com`)"
        - "traefik.http.routers.chiluisa-secure.tls=true"
        - "traefik.http.routers.chiluisa-secure.tls.certresolver=http"
        - "traefik.http.routers.chiluisa-secure.service=chiluisa"
        - "traefik.http.services.chiluisa.loadbalancer.server.port=5000"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
